<div class="messages" #scrollContainer>
  @for (m of messages(); track m.id) {
    <article [class.mine]="m.author.id === meId()">
      <app-avatar [avatarId]="m.author.avatarId" />
      <div class="content">
        <span class="head">
          {{ m.author.name }} - {{ m.timeStamp | date:'HH:mm'}}
        </span>
          <p>{{ m.text }}</p>
      </div>
    </article> 
  }
</div>
